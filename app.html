<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>리더스아트 | 학부모 포털 & 원장님 관리자 모드</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            art: {
              coral: "#FF8A7A",
              peach: "#FFECE4",
              yellow: "#FFE27A",
              mint: "#90E0EF",
              lavender: "#C77DFF",
              cream: "#FAF8F5",
              charcoal: "#2B2D42"
            }
          },
          fontFamily: {
            sans: ['Noto Sans KR', '-apple-system', 'sans-serif'],
            art: ['Gaegu', 'cursive']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f1f5f9;
      color: #2B2D42;
      -webkit-tap-highlight-color: transparent;
    }
    
    @media (min-width: 640px) {
      .mobile-container {
        max-width: 430px;
        height: 880px;
        border-radius: 40px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.25), 0 0 0 12px #1e293b;
        margin: 1.5rem auto;
        overflow: hidden;
        position: relative;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    .animate-pop-in { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const ACADEMY_INFO = {
      name: "리더스아트",
      subText: "창의 감성 어린이 미술전문 • 신연정 원장",
      phone: "02-555-7890",
      address: "서울시 강남구 미술로 123 🎨 2층 리더스아트",
      director: "신연정 원장님",
      teacher: "주미 선생님"
    };

    const STUDENTS = [
      { id: "s1", name: "김우진", grade: "초등 3학년 (10세)", ageGroup: "초등 저학년", class: "융합 조형 & 수채화반", avatarEmoji: "👦" },
      { id: "s2", name: "배시우", grade: "7세 유치부", ageGroup: "유치부 (5~7세)", class: "창의 표현 & 클레이반", avatarEmoji: "👧" },
      { id: "s3", name: "배단우", grade: "초등 5학년 (12세)", ageGroup: "초등 고학년", class: "웹툰 일러스트 & 입체 조소반", avatarEmoji: "🧑" }
    ];

    const INITIAL_ARTWORKS = [
      {
        id: "art-5",
        studentId: "s3",
        title: "미래의 친환경 에코 시티",
        year: "2026",
        date: "2026.08.06",
        category: "일러스트",
        imageUrl: "./public/images/artwork_illust_danwoo.jpg",
        materials: "디지털 드로잉 패드, 마카펜, 아크릴 페인트",
        teacherName: "신연정 원장님",
        teacherAvatar: "👩‍🎨",
        feedback: "단우(12세)가 원근법과 공기 투시법을 기막히게 구사하여 미래도시의 유기적 건축미를 완벽히 구현해냈어요!",
        likes: 25
      },
      {
        id: "art-hist-danwoo-1",
        studentId: "s3",
        title: "2025 쿵푸팬더 동화 드로잉 (11세 초등 4학년)",
        year: "2025",
        date: "2025.10.15",
        category: "일러스트",
        imageUrl: "./public/images/artwork_illust_danwoo.jpg",
        materials: "색연필, 동화 마카",
        teacherName: "신연정 원장님",
        teacherAvatar: "👩‍🎨",
        feedback: "[11세 과거 성장 기록] 1년 전 단우의 작품입니다! 캐릭터 동작 표현이 뛰어납니다!",
        likes: 18
      }
    ];

    const TUITION_DATA = [
      { id: "tui-s3", studentId: "s3", name: "배단우", amount: "220,000원", status: "수납 완료", date: "2026.08.02", method: "신용카드 (KB국민)" },
      { id: "tui-s1", studentId: "s1", name: "김우진", amount: "180,000원", status: "수납 완료", date: "2026.08.04", method: "계좌이체" },
      { id: "tui-s2", studentId: "s2", name: "배시우", amount: "160,000원", status: "납부 예정", date: "납부기한 08.10까지", method: "원내 결제 예정" }
    ];

    function Header({ selectedStudent, onSelectStudent, isAdmin, onOpenLoginModal, onLogout }) {
      const [isOpen, setIsOpen] = useState(false);
      const current = STUDENTS.find(s => s.id === selectedStudent) || STUDENTS[0];

      return (
        <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-rose-100 px-4 py-2.5 shadow-xs">
          {isAdmin ? (
            <div className="bg-gradient-to-r from-rose-500 via-purple-500 to-amber-500 text-white text-[10px] font-bold px-3 py-1 -mx-4 -mt-2.5 mb-2 flex items-center justify-between">
              <span>🎨 원장님 관리자 접속 중 (전체 학생 관리)</span>
              <button onClick={onLogout} className="bg-white/20 px-2 py-0.5 rounded-full">로그아웃</button>
            </div>
          ) : (
            <div className="bg-slate-800 text-white text-[10px] font-bold px-3 py-1 -mx-4 -mt-2.5 mb-2 flex items-center justify-between">
              <span className="text-rose-300">🔒 학부모 모드: 내 자녀 [{current.name}] 정보 전용 보호 중</span>
            </div>
          )}

          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-rose-400 to-sky-300 p-0.5 flex items-center justify-center">
                <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center text-base">🎨</div>
              </div>
              <div>
                <h1 className="text-sm font-bold text-slate-800">{ACADEMY_INFO.name}</h1>
                <p className="text-[10px] font-semibold text-rose-500">{ACADEMY_INFO.subText}</p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setIsOpen(!isOpen)}
                className="flex items-center gap-1.5 bg-rose-50 border border-rose-200 rounded-full px-2.5 py-1 text-xs font-semibold text-slate-700"
              >
                <span>{current.avatarEmoji}</span>
                <span>{current.name}</span>
                <span className="text-[10px]">▼</span>
              </button>

              {!isAdmin && (
                <button
                  onClick={onOpenLoginModal}
                  className="bg-slate-100 text-slate-600 px-2 py-1 rounded-full text-xs font-bold border"
                >
                  🔒 관리자
                </button>
              )}
            </div>
          </div>
        </header>
      );
    }

    function BottomNav({ activeTab, onTabChange }) {
      const items = [
        { id: 'gallery', label: '작품 갤러리', icon: '🎨' },
        { id: 'history', label: '성장 히스토리', icon: '📜' },
        { id: 'tuition', label: '원비 수납', icon: '💳' },
        { id: 'notice', label: '공지사항', icon: '📢' },
        { id: 'attendance', label: '출석 현황', icon: '📅' }
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 z-30 max-w-[430px] mx-auto bg-white/95 border-t border-rose-100 px-2 py-2 shadow-lg">
          <div className="flex items-center justify-around">
            {items.map((item) => (
              <button
                key={item.id}
                onClick={() => onTabChange(item.id)}
                className={`flex flex-col items-center py-1 px-2 text-xs ${activeTab === item.id ? 'text-rose-500 font-bold' : 'text-slate-400 font-medium'}`}
              >
                <span className="text-lg">{item.icon}</span>
                <span className="text-[10px]">{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    }

    function App() {
      const [studentId, setStudentId] = useState('s3');
      const [tab, setTab] = useState('gallery');
      const [isAdmin, setIsAdmin] = useState(false);
      const [artworks] = useState(INITIAL_ARTWORKS);

      const currentStudent = STUDENTS.find(s => s.id === studentId);
      const currentTuition = TUITION_DATA.find(t => t.studentId === currentStudent.id);

      return (
        <div className="min-h-screen bg-slate-200 flex items-center justify-center p-0 sm:p-4">
          <div className="mobile-container w-full min-h-screen sm:min-h-[880px] bg-slate-50 flex flex-col shadow-2xl overflow-hidden relative">
            <Header
              selectedStudent={studentId}
              onSelectStudent={setStudentId}
              isAdmin={isAdmin}
              onOpenLoginModal={() => setIsAdmin(true)}
              onLogout={() => setIsAdmin(false)}
            />

            <main className="flex-1 overflow-y-auto px-4 py-3 pb-20">
              {tab === 'gallery' && (
                <div className="space-y-4">
                  <div className="bg-gradient-to-r from-rose-100 to-amber-100 p-4 rounded-3xl border border-rose-200">
                    <h2 className="text-base font-bold text-slate-800">{currentStudent.name} ({currentStudent.ageGroup})의 미술 작품 🎨</h2>
                    <p className="text-xs text-slate-600 mt-1">
                      {isAdmin ? '✨ 원장님 관리자 모드 접속 중 (전체 관리)' : '🔒 학부모 모드: 내 아이 정보만 암호화 보관'}
                    </p>
                  </div>

                  <div className="grid grid-cols-1 gap-4">
                    {artworks.filter(a => a.studentId === currentStudent.id).map(art => (
                      <div key={art.id} className="bg-white rounded-3xl border border-rose-100 p-3 space-y-2">
                        <img src={art.imageUrl} alt={art.title} className="w-full h-48 object-cover rounded-2xl" />
                        <h3 className="font-bold text-slate-800 text-sm">{art.title}</h3>
                        <div className="bg-amber-50 p-2.5 rounded-2xl text-xs text-slate-700">
                          <div className="font-bold text-amber-800">{art.teacherAvatar} {art.teacherName} 피드백</div>
                          <p>"{art.feedback}"</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {tab === 'history' && (
                <div className="space-y-4">
                  <div className="bg-purple-100 p-4 rounded-3xl border border-purple-200">
                    <h2 className="text-base font-bold text-purple-900">📜 {currentStudent.name}의 미술 성장 히스토리 타임라인</h2>
                    <p className="text-xs text-purple-700 mt-1">2025년과 2026년 아이의 발달 스킬과 관찰 피드백 기록입니다.</p>
                  </div>

                  <div className="border-l-2 border-purple-300 ml-4 pl-4 space-y-4">
                    {artworks.filter(a => a.studentId === currentStudent.id).map(art => (
                      <div key={art.id} className="bg-white p-3 rounded-2xl border space-y-1">
                        <span className="text-[10px] font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded-full">{art.date} ({art.year}년)</span>
                        <h4 className="font-bold text-xs text-slate-800 mt-1">{art.title}</h4>
                        <p className="text-xs text-slate-600">"{art.feedback}"</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {tab === 'tuition' && (
                <div className="space-y-4">
                  <div className="bg-amber-100 p-4 rounded-3xl border border-amber-200">
                    <h2 className="text-base font-bold text-amber-900">💳 {currentStudent.name} 수강료 / 원비 현황</h2>
                    <p className="text-xs text-amber-700 mt-1">{currentStudent.grade} • {currentStudent.class}</p>
                  </div>

                  {currentTuition && (
                    <div className="bg-white rounded-3xl p-4 border space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-slate-500">2026년 8월 수강료</span>
                        <span className="text-base font-black text-rose-600">{currentTuition.amount}</span>
                      </div>
                      <div className="flex justify-between text-xs">
                        <span>수납 상태:</span>
                        <span className="font-bold text-emerald-600">{currentTuition.status}</span>
                      </div>
                      <div className="flex justify-between text-xs text-slate-500">
                        <span>결제일시/수단:</span>
                        <span>{currentTuition.date} ({currentTuition.method})</span>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <BottomNav activeTab={tab} onTabChange={setTab} />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
