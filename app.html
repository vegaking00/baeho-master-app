                    {STUDENTS.map((student) => (
                      <button
                        key={student.id}
                        onClick={() => {
                          onSelectStudent(student.id);
                          setIsOpen(false);
                        }}
                        className={`w-full flex items-center justify-between p-2 rounded-xl text-left mt-1 text-xs ${
                          selectedStudent === student.id ? 'bg-rose-50 text-rose-700 font-bold' : 'hover:bg-slate-50 text-slate-600'
                        }`}
                      >
                        <div className="flex items-center gap-2">
                          <span>{student.avatarEmoji}</span>
                          <div>
                            <div>{student.name} 학생</div>
                            <div className="text-[10px] text-slate-400">{student.grade}</div>
                          </div>
                        </div>
                        {selectedStudent === student.id && <span className="text-rose-500 font-bold">✓</span>}
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>
          </div>
        </header>
      );
    }

    // Bottom Navigation
    function BottomNav({ activeTab, onTabChange, unreadCount }) {
      const items = [
        { id: 'gallery', label: '작품 갤러리', icon: '🎨' },
        { id: 'notice', label: '공지사항', icon: '📢', badge: unreadCount > 0 ? unreadCount : null },
        { id: 'attendance', label: '출석 현황', icon: '📅' },
        { id: 'schedule', label: '학원 일정', icon: '📆' }
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 z-30 max-w-[430px] mx-auto bg-white/95 backdrop-blur-md border-t border-rose-100 px-2 py-2 shadow-lg">
          <div className="flex items-center justify-around">
            {items.map((item) => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => onTabChange(item.id)}
                  className={`relative flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all ${
                    isActive ? 'text-rose-500 font-bold' : 'text-slate-400 font-medium'
                  }`}
                >
                  {isActive && <span className="absolute -top-1 w-8 h-1 bg-rose-400 rounded-full animate-fade-in" />}
                  <div className="relative text-lg">
                    {item.icon}
                    {item.badge && (
                      <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                        {item.badge}
                      </span>
                    )}
                  </div>
                  <span className="text-[11px] mt-0.5">{item.label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    // Gallery Tab
    function GalleryTab({ artworks, student, onSelectArtwork }) {
      const [category, setCategory] = useState('전체');
      const categories = ['전체', '수채화', '일러스트', '오일파스텔', '조소/만들기'];

      const studentArtworks = artworks.filter(a => a.studentId === student.id);
      const filtered = category === '전체' ? studentArtworks : studentArtworks.filter(a => a.category === category);

      return (
        <div className="space-y-4 pb-20 animate-fade-in">
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-rose-100 via-amber-100 to-sky-100 p-4 rounded-3xl border border-rose-200 shadow-xs">
            <div className="flex items-center gap-3">
              <span className="text-3xl">{student.avatarEmoji}</span>
              <div>
                <h2 className="text-base font-bold text-slate-800">{student.name}의 리더스아트 작품집 🎨</h2>
                <p className="text-xs text-slate-600 mt-0.5">담당: <span className="font-semibold text-rose-600">신연정 원장님 / 주미 선생님</span></p>
              </div>
            </div>
          </div>

          {/* Categories */}
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
            {categories.map(c => (
              <button
                key={c}
                onClick={() => setCategory(c)}
                className={`px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                  category === c ? 'bg-rose-500 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'
                }`}
              >
                {c}
              </button>
            ))}
          </div>

          {/* Artwork Cards */}
          <div className="grid grid-cols-1 gap-4">
            {filtered.map(art => (
              <div
                key={art.id}
                onClick={() => onSelectArtwork(art)}
                className="bg-white rounded-3xl border border-rose-100 overflow-hidden shadow-xs hover:shadow-md transition-all cursor-pointer group"
              >
                <div className="relative aspect-4/3 bg-slate-900">
                  <img src={art.imageUrl} alt={art.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  <span className="absolute top-3 left-3 bg-white/90 text-rose-700 text-[10px] font-bold px-2.5 py-1 rounded-full shadow-2xs">
                    {art.category}
                  </span>
                  <span className="absolute bottom-3 right-3 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full">
                    {art.date}
                  </span>
                </div>

                <div className="p-4 space-y-2">
                  <h3 className="font-bold text-slate-800 text-sm group-hover:text-rose-600">{art.title}</h3>
                  <div className="bg-amber-50 p-3 rounded-2xl text-[11px] text-slate-700 border border-amber-100">
                    <div className="font-bold text-amber-800 mb-1">{art.teacherAvatar} {art.teacherName} 선생님 코멘트</div>
                    <p className="line-clamp-2 text-slate-600">"{art.feedback}"</p>
                  </div>
                  <div className="flex justify-between items-center text-xs text-slate-400 pt-1 border-t border-slate-50">
                    <div className="flex gap-3">
                      <span className="text-rose-500 font-semibold">❤️ {art.likes}</span>
                      <span>💬 {art.comments?.length || 0}</span>
                    </div>
                    <span className="text-rose-500 font-bold text-xs">자세히 보기 →</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Notice Tab
    function NoticeTab({ notices, onSelectNotice }) {
      return (
        <div className="space-y-3 pb-20 animate-fade-in">
          <div className="bg-gradient-to-r from-amber-100 to-rose-100 p-4 rounded-3xl border border-amber-200">
            <h2 className="text-base font-bold text-slate-800">📢 리더스아트 공지사항</h2>
            <p className="text-xs text-slate-600 mt-1">신연정 원장님과 주미 선생님이 전하는 원내 안내입니다.</p>
          </div>

          <div className="space-y-2.5">
            {notices.map(n => (
              <div
                key={n.id}
                onClick={() => onSelectNotice(n)}
                className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                  n.tag === '중요' ? 'bg-rose-50/80 border-rose-200' : 'bg-white border-slate-100'
                }`}
              >
                <div className="flex items-center gap-2 mb-1">
                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                    n.tag === '중요' ? 'bg-rose-500 text-white' : 'bg-sky-100 text-sky-700'
                  }`}>
                    {n.tag}
                  </span>
                  <span className="text-[11px] text-slate-400">{n.date}</span>
                </div>
                <h3 className="text-xs font-bold text-slate-800">{n.title}</h3>
                <p className="text-[11px] text-slate-500 line-clamp-2 mt-1">{n.content}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Attendance Tab
    function AttendanceTab({ student }) {
      const data = ATTENDANCE_DATA[student.id] || ATTENDANCE_DATA['s1'];
      const summary = data.summary;
      const daysRecord = data.days;
      const [selectedDate, setSelectedDate] = useState('2026-08-07');

      const cells = [];
      for (let i = 0; i < 6; i++) cells.push(null);
      for (let day = 1; day <= 31; day++) {
        const dateStr = `2026-08-${day < 10 ? '0' + day : day}`;
        cells.push({ day, dateStr, record: daysRecord[dateStr] });
      }

      const selectedInfo = daysRecord[selectedDate];

      return (
        <div className="space-y-4 pb-20 animate-fade-in">
          <div className="bg-gradient-to-r from-emerald-100 to-sky-100 p-4 rounded-3xl border border-emerald-200">
            <h2 className="text-base font-bold text-slate-800">📅 {student.name} 학생의 8월 출석 현황</h2>
            <p className="text-xs text-slate-600 mt-1">월 출석률: <strong className="text-emerald-600 text-sm">{summary.attendanceRate}%</strong></p>
            <div className="grid grid-cols-4 gap-2 mt-3 text-center">
              <div className="bg-white/80 p-2 rounded-xl text-xs">
                <div className="text-[10px] text-slate-400">출석</div>
                <div className="font-bold text-emerald-600">{summary.presentDays}일</div>
              </div>
              <div className="bg-white/80 p-2 rounded-xl text-xs">
                <div className="text-[10px] text-slate-400">지각</div>
                <div className="font-bold text-amber-600">{summary.lateDays}일</div>
              </div>
              <div className="bg-white/80 p-2 rounded-xl text-xs">
                <div className="text-[10px] text-slate-400">결석</div>
                <div className="font-bold text-rose-500">{summary.absentDays}일</div>
              </div>
              <div className="bg-white/80 p-2 rounded-xl text-xs">
                <div className="text-[10px] text-slate-400">보강</div>
                <div className="font-bold text-purple-600">{summary.makeupDays}일</div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-4 border border-slate-100 space-y-2">
            <div className="text-center font-bold text-sm text-slate-800 pb-2 border-b border-slate-100">2026년 8월</div>
            <div className="grid grid-cols-7 text-center text-[11px] font-bold text-slate-400">
              <span className="text-rose-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span className="text-sky-500">토</span>
            </div>
            <div className="grid grid-cols-7 gap-1 text-center">
              {cells.map((cell, idx) => {
                if (!cell) return <div key={idx} className="h-10" />;
                const isSel = selectedDate === cell.dateStr;
                const rec = cell.record;
                return (
                  <button
                    key={cell.dateStr}
                    onClick={() => setSelectedDate(cell.dateStr)}
                    className={`h-10 rounded-xl flex flex-col items-center justify-center text-xs ${
                      isSel ? 'bg-rose-500 text-white font-bold' : 'hover:bg-slate-50 text-slate-700'
                    }`}
                  >
                    <span>{cell.day}</span>
                    {rec && (
                      <span className={`w-1.5 h-1.5 rounded-full mt-0.5 ${
                        rec.status === 'present' ? 'bg-emerald-500' : rec.status === 'late' ? 'bg-amber-500' : 'bg-purple-500'
                      }`} />
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="bg-white p-4 rounded-3xl border border-rose-100 space-y-2">
            <div className="font-bold text-xs text-slate-800">📅 {selectedDate} 등원 기록</div>
            {selectedInfo ? (
              <div className="text-xs space-y-2">
                <div className="flex justify-between bg-slate-50 p-2 rounded-xl text-slate-600">
                  <span>입실: <strong>{selectedInfo.timeIn}</strong></span>
                  <span>퇴실: <strong>{selectedInfo.timeOut}</strong></span>
                </div>
                <div className="bg-rose-50 p-2.5 rounded-xl text-slate-700 border border-rose-100">
                  <div className="font-bold text-rose-600 text-[10px]">수업 메모 (선생님)</div>
                  <div>{selectedInfo.memo}</div>
                </div>
              </div>
            ) : (
              <p className="text-xs text-slate-400 text-center py-2">수업이 없는 날입니다.</p>
            )}
          </div>
        </div>
      );
    }

    // Schedule Tab
    function ScheduleTab() {
      const theme = SCHEDULE_DATA.monthlyTheme;
      const events = SCHEDULE_DATA.events;

      return (
        <div className="space-y-4 pb-20 animate-fade-in">
          <div className="bg-gradient-to-r from-rose-400 to-amber-300 p-0.5 rounded-3xl">
            <div className="bg-white rounded-[22px] p-4 space-y-2">
              <span className="bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-0.5 rounded-full">이달의 실기 주제</span>
              <h2 className="text-base font-bold text-slate-800">{theme.title}</h2>
              <p className="text-xs text-slate-600 bg-rose-50 p-2.5 rounded-xl">{theme.description}</p>
            </div>
          </div>

          <div className="space-y-2.5">
            <h3 className="text-xs font-bold text-slate-700">8월 리더스아트 주요 일정</h3>
            {events.map(e => (
              <div key={e.id} className="bg-white p-3.5 rounded-2xl border border-slate-100 space-y-1">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded-lg">{e.date} ({e.day})</span>
                  <span className="text-[10px] font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">{e.dDay}</span>
                </div>
                <div className="text-xs font-bold text-slate-800">{e.title}</div>
                <p className="text-[11px] text-slate-500">{e.description}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Modals
    function ArtworkModal({ artwork, onClose, onAddComment }) {
      const [txt, setTxt] = useState('');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
          <div className="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl space-y-3 p-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold text-rose-600">{artwork.category}</span>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            <img src={artwork.imageUrl} alt={artwork.title} className="w-full h-48 object-cover rounded-2xl" />
            <h2 className="text-base font-bold text-slate-800">{artwork.title}</h2>
            <div className="text-xs text-slate-500">🎨 재료: {artwork.materials}</div>
            <div className="bg-amber-50 p-3 rounded-2xl text-xs text-slate-700">
              <div className="font-bold text-amber-800 mb-1">{artwork.teacherAvatar} {artwork.teacherName} 선생님 코멘트</div>
              <p>"{artwork.feedback}"</p>
            </div>

            <div className="space-y-2 pt-2 border-t">
              <div className="font-bold text-xs text-slate-700">칭찬 댓글 ({artwork.comments?.length || 0})</div>
              {artwork.comments?.map(c => (
                <div key={c.id} className="bg-slate-50 p-2 rounded-xl text-xs">
                  <div className="font-bold text-rose-600">{c.name}</div>
                  <div>{c.text}</div>
                </div>
              ))}
              <div className="flex gap-2">
                <input
                  type="text"
                  placeholder="칭찬 메시지 입력..."
                  value={txt}
                  onChange={e => setTxt(e.target.value)}
                  className="flex-1 bg-slate-100 rounded-full px-3 py-1.5 text-xs focus:outline-none"
                />
                <button
                  onClick={() => {
                    if (txt) { onAddComment(artwork.id, txt); setTxt(''); }
                  }}
                  className="bg-rose-500 text-white text-xs px-3 py-1.5 rounded-full font-bold"
                >
                  등록
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function NoticeModal({ notice, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
          <div className="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 shadow-2xl">
            <div className="flex justify-between items-center">
              <span className="bg-rose-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{notice.tag}</span>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            <h2 className="text-base font-bold text-slate-800">{notice.title}</h2>
            <div className="text-xs text-slate-400">{notice.date}</div>
            <div className="text-xs text-slate-700 leading-relaxed whitespace-pre-line bg-slate-50 p-3 rounded-2xl">{notice.content}</div>
            <button onClick={onClose} className="w-full py-2.5 bg-rose-500 text-white font-bold text-xs rounded-xl">
              확인했습니다
            </button>
          </div>
        </div>
      );
    }

    // MAIN APP
    function App() {
      const [studentId, setStudentId] = useState('s1');
      const [tab, setTab] = useState('gallery');
      const [selectedArt, setSelectedArt] = useState(null);
      const [selectedNotice, setSelectedNotice] = useState(null);
      const [artworks, setArtworks] = useState(INITIAL_ARTWORKS);
      const [notices, setNotices] = useState(INITIAL_NOTICES);

      const currentStudent = STUDENTS.find(s => s.id === studentId);
      const unreadCount = notices.filter(n => !n.isRead).length;

      const handleAddComment = (artId, text) => {
        const newC = { id: Date.now(), name: "학부모", date: "방금 전", text };
        setArtworks(prev => prev.map(a => a.id === artId ? { ...a, comments: [...(a.comments || []), newC] } : a));
        if (selectedArt && selectedArt.id === artId) {
          setSelectedArt(prev => ({ ...prev, comments: [...(prev.comments || []), newC] }));
        }
      };

      return (
        <div className="min-h-screen bg-slate-200 flex items-center justify-center p-0 sm:p-4">
          <div className="mobile-container w-full min-h-screen sm:min-h-[880px] bg-slate-50 flex flex-col shadow-2xl overflow-hidden relative">
            <Header selectedStudent={studentId} onSelectStudent={setStudentId} unreadCount={unreadCount} />
            <main className="flex-1 overflow-y-auto px-4 py-3">
              {tab === 'gallery' && <GalleryTab artworks={artworks} student={currentStudent} onSelectArtwork={setSelectedArt} />}
              {tab === 'notice' && <NoticeTab notices={notices} onSelectNotice={setSelectedNotice} />}
              {tab === 'attendance' && <AttendanceTab student={currentStudent} />}
              {tab === 'schedule' && <ScheduleTab />}
            </main>
            <BottomNav activeTab={tab} onTabChange={setTab} unreadCount={unreadCount} />

            {selectedArt && <ArtworkModal artwork={selectedArt} onClose={() => setSelectedArt(null)} onAddComment={handleAddComment} />}
            {selectedNotice && <NoticeModal notice={selectedNotice} onClose={() => setSelectedNotice(null)} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
